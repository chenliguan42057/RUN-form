name: 阳光花园 · 钉钉统一推送

# ─────────────────────────────────────────────────────────────────────────────
# T05 前半 · 统一推送工作流（目标时间 + 提前量）
#
# 【解决什么痛点】
#   1) 老迟到：GitHub Actions 的 schedule 天生不准点，实测延迟 15~45 分钟，高峰期还会跳过。
#      这是平台限制，改 cron 表达式救不回来。
#   2) 太烦：v1 有 6 个 workflow 各推各的。v2 收敛成【本文件这 1 个】，
#      默认只开 4 个槽（07:00 / 21:30 / 22:30 / 00:00），12:00 与 18:00 默认关。
#
# 【核心算法 · 目标时间 + 提前量】
#   用户只关心「我希望几点收到」，系统倒推 GitHub 的触发时刻：
#       fireAt = targetAt − leadMinutes          ← GitHub「应该」在这一刻触发
#       deliverAt = targetAt                     ← 消息「应该」在这一刻送达
#   cron 固定 */10（每 10 分钟一次，UTC），把「该不该发」交给脚本判定，因为
#   GitHub 不允许在运行时改 cron。窗口判定（脚本内 PRE_WINDOW_MIN / POST_WINDOW_MIN）：
#       now < fireAt − 5min            → 还没进窗口，跳过，等下一次 cron
#       fireAt − 5min ≤ now < targetAt → 补睡到 targetAt 再发（GitHub 没延迟 / 延迟没吃满提前量）
#       targetAt ≤ now ≤ targetAt+25min→ 立即发（GitHub 迟到了，迟到多少记多少）
#       now > targetAt + 25min         → 放弃今天这一条（宁可不发，也不要半夜弹「早安」）
#
#   ⚠️ 与设计文档 §7.2 的一处有意偏离（已评估，理由如下）：
#       §7.2 字面写的是「补睡到 fireAt 就发」。但那样做的话，GitHub 不延迟时消息会在
#       targetAt − leadMinutes（默认 06:30）就送达 —— 用户要 07:00，却 06:30 收到，
#       而且 lateSec 恒为 −30 分钟，§7.3 的校准公式 suggestedLead = lead + avgLateMin
#       会一路收敛到 0，形成「提前量 0 → 又变迟到 → 再加回来」的振荡。
#       所以本实现把 fireAt 只当作「窗口开门时刻」，真正送达时刻一律对齐 targetAt：
#         · GitHub 准时/小延迟 → 补睡到 targetAt，lateSec ≈ 0（准点送达）
#         · GitHub 延迟超过提前量 → 立刻发，lateSec > 0（诚实记录迟到）
#       这样 lateSec 恒 ≥ 0，校准公式收敛到稳定不动点。
#       想退回 §7.2 字面行为：在 profile.push 里设 "sleepToTarget": false。
#       顺带：窗口右端从「fireAt+25min」改为「targetAt+25min」，否则窗口在 targetAt
#       前 5 分钟就关了，GitHub 真迟到的情况一条都兜不住。
#
# 【幂等】data/push-state.json 的 sent["YYYY-MM-DD|slotKey"] 存在即跳过。
#
# 【校准闭环】每次发送后记录 lateSec = sentAt − targetAt（相对【用户目标时间】，不是 fireAt）。
#   前端管理页读它算「平均迟到」并给出建议提前量。字段结构见下，改动必须同步前端。
#
# ── data/push-state.json 字段契约（仅本工作流写，前端只读）──────────────────
#   {
#     "sent":    { "<dayKey>|<slotKey>": {          # 幂等键
#                    "sentAt":  <ms>,               # 实际发送时刻
#                    "targetAt":<ms>,               # 用户希望收到的时刻
#                    "lateSec": <int>,              # sentAt − targetAt，正常 ≥ 0（准点≈0）
#                    "variant": <int>,              # 命中的文案变体下标
#                    "manual":  <bool>              # 是否手动触发（手动的不进校准样本）
#                 } },
#     "history": [ { "dayKey", "slot", "lateSec", "sentAt" } ],   # 最近 14 条，按时间升序
#     "settle":  { "<dayKey>": {                    # 日切结算台账（00:00 槽产出）
#                    "perfect":       <bool>,       # 当天是否全勤
#                    "done":          <int>,        # 已完成核心任务数
#                    "total":         <int>,        # 应有核心任务数
#                    "streakAfter":   <int>,        # 结算后连续全勤天数
#                    "brokenStreak":  <int>,        # 结算后连续断签天数（全勤则为 0）
#                    "coupons":       [<couponId>], # 本次发放的野餐篮 id
#                    "settledAt":     <ms>
#                 } },
#     "streak":  { "current": <int>, "best": <int>, "lastPerfectDay": "<dayKey>|null",
#                  "brokeDays": <int>, "brokenStreak": <int> },
#     "calibration": { "avgLateMin": <float>, "suggestedLead": <int>,
#                      "samples": <int>, "updatedAt": <ms> },
#     "updatedAt": <ms>
#   }
#   注：连续天数（streak）的权威账本放这里而不是 profile.json —— profile.json 由
#       前端 sync-state 频繁写入，本工作流不碰它，避免两边互相覆盖。
#
# ── Profile.push 期望结构（data/profile.json，本工作流只读）──────────────────
#   "push": {
#     "leadMinutes": 30,
#     "slots": [
#       { "key":"morning",  "enabled":true,  "target":"07:00", "dayOffset":0 },
#       { "key":"noon",     "enabled":false, "target":"12:00", "dayOffset":0 },
#       { "key":"dusk",     "enabled":false, "target":"18:00", "dayOffset":0 },
#       { "key":"night",    "enabled":true,  "target":"21:30", "dayOffset":0 },
#       { "key":"final",    "enabled":true,  "target":"22:30", "dayOffset":0 },
#       { "key":"midnight", "enabled":true,  "target":"00:00", "dayOffset":1 }
#     ],
#     "calibration": { "avgLateMin":0, "suggestedLead":30, "updatedAt":0 }
#   }
#   · slot.key 只认这 6 个（未知 key 会被忽略并打警告）。
#   · profile 里缺的槽位用本文件 DEFAULT_SLOTS 的默认值补齐。
#   · dayOffset=1 只给 midnight：它总结「刚过去的这一天」，触发落在次日 00:00 前 leadMinutes 分钟。
#
# 【00:00 结算槽干真活】全勤判定 → streak ±1 → 发野餐篮（幂等）→ 更新 pet/garden → 写回仓库。
#
# 【安全】所有 ${{ }} 只出现在 env: 里，绝不拼进 shell 脚本（防注入），沿用 v1 做法。
#        钉钉 webhook + HMAC-SHA256 加签完全复用 .github/workflows/dingtalk-reminder.yml。
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # UTC，全天 144 次。真实触发时刻由脚本按「目标时间 − 提前量」判定。
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "强制推送的槽位 key（morning/noon/dusk/night/final/midnight）；留空＝按时间正常判定"
        type: string
        required: false
        default: ""
      force:
        description: "忽略幂等去重，强制再发一次（仅配合 slot 使用）"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "演练模式：只打印判定结果与文案，不发钉钉、不写任何文件"
        type: boolean
        required: false
        default: false

# 同一时刻只允许一个推送任务在跑，避免两次调度撞车把同一条推两遍。
# cancel-in-progress: false —— 宁可排队，也不要把已经发出去一半的任务砍掉。
concurrency:
  group: dingtalk-push
  cancel-in-progress: false

# 需要写权限来提交 data/push-state.json / pet-state.json / garden-state.json / coupons.json
permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    # 最长补睡 = LEAD_MAX(60) + PRE_WINDOW(5) = 65 分钟，留 15 分钟余量；同时防止脚本卡死占满配额。
    timeout-minutes: 80
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # 全量历史：推送冲突时要 git pull --rebase 重试，浅克隆会 rebase 失败
          fetch-depth: 0

      - name: 判定槽位并推送钉钉
        id: send
        # webhook / secret 一律从 GitHub Secrets 读，绝不写死真实值；
        # workflow_dispatch 的输入统一走 env，避免 ${{ }} 直接拼进脚本造成注入。
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FORCE_SLOT: ${{ inputs.slot }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          # -*- coding: utf-8 -*-
          """阳光花园 v2 · 钉钉统一推送。

          流程：
            1. 读 data/profile.json 的 push 配置（leadMinutes / slots）
            2. 读 data/{plans,checkins,pet-state,garden-state,coupons}.json 组装文案上下文
            3. 读 data/push-state.json 做幂等 + 取连续天数台账
            4. 逐个槽位算 fireAt → 窗口判定 → 可选补睡 → 渲染文案 → 加签发送
            5. midnight 槽额外跑日切结算（全勤 / 连续天数 / 野餐篮 / 精灵 / 花园）
            6. 写回 data/push-state.json（以及结算涉及的 pet/garden/coupons）
          """
          import base64
          import calendar
          import datetime
          import hashlib
          import hmac
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          # ---------------------------- 常量 ----------------------------

          DATA_DIR = "data"
          PROFILE_PATH = os.path.join(DATA_DIR, "profile.json")
          PLANS_PATH = os.path.join(DATA_DIR, "plans.json")
          CHECKINS_PATH = os.path.join(DATA_DIR, "checkins.json")
          PET_PATH = os.path.join(DATA_DIR, "pet-state.json")
          GARDEN_PATH = os.path.join(DATA_DIR, "garden-state.json")
          COUPONS_PATH = os.path.join(DATA_DIR, "coupons.json")
          STATE_PATH = os.path.join(DATA_DIR, "push-state.json")

          SITE_URL = "https://chenliguan42057.github.io/RUN-form/manage.html"

          # 窗口参数（见文件头注释）。POST 开到 25 分钟是为了兜住 GitHub 高峰期抖动。
          PRE_WINDOW_MIN = 5
          POST_WINDOW_MIN = 25
          # 补睡上限：= LEAD_MAX(60) + PRE_WINDOW_MIN(5) + 余量。超过就放弃，防止算错时钟睡死。
          MAX_SLEEP_SEC = 70 * 60
          # 提前量边界：0 = 不提前（等于整点硬扛 GitHub 延迟），60 = 提前一小时（足够兜住 15~45 分钟抖动）
          LEAD_MIN, LEAD_MAX, LEAD_DEFAULT = 0, 60, 30
          # sent 台账保留天数，防止文件无限增长
          KEEP_DAYS = 120
          # 校准样本保留条数（前端取同样的窗口算平均迟到）
          HISTORY_SIZE = 14
          # 券有效期（天）
          COUPON_VALID_DAYS = 180

          # 北京时间（UTC+8）。仓库里所有 target / plan.time / dayKey 都按北京时间理解。
          BJ_TZ = datetime.timezone(datetime.timedelta(hours=8))

          # 默认槽位（profile.json 里缺项时用它补齐；用户可在管理页改 target / enabled）
          DEFAULT_SLOTS = [
              {"key": "morning",  "label": "早安",     "enabled": True,  "target": "07:00", "dayOffset": 0},
              {"key": "noon",    "label": "午间",     "enabled": False, "target": "12:00", "dayOffset": 0},
              {"key": "dusk",    "label": "傍晚",     "enabled": False, "target": "18:00", "dayOffset": 0},
              {"key": "night",   "label": "睡前冲刺", "enabled": True,  "target": "21:30", "dayOffset": 0},
              {"key": "final",   "label": "最后提醒", "enabled": True,  "target": "22:30", "dayOffset": 0},
              {"key": "midnight","label": "日切结算", "enabled": True,  "target": "00:00", "dayOffset": 1},
          ]
          SLOT_KEYS = [s["key"] for s in DEFAULT_SLOTS]

          # 槽位标题（钉钉 actionCard 的 title）
          SLOT_TITLES = {
              "morning":  "🌤 早安 · 阳光花园",
              "noon":     "🍚 午间 · 阳光花园",
              "dusk":     "🌇 傍晚 · 阳光花园",
              "night":    "🌙 睡前冲刺 · 阳光花园",
              "final":    "⏰ 最后提醒 · 阳光花园",
              "midnight": "🌙 今日结算 · 阳光花园",
          }

          # 精灵 5 阶段（相处天数 = diffDays(bornAt, today) + 1）
          # ⚠️ 改动需同步 js/systems/pet.js 的 PET_STAGES
          PET_STAGES = [
              {"key": "egg",    "emoji": "🥚", "minDay": 1,  "label": "精灵蛋"},
              {"key": "baby",   "emoji": "🐣", "minDay": 4,  "label": "幼年期"},
              {"key": "grow",   "emoji": "🌱", "minDay": 15, "label": "成长期"},
              {"key": "mature", "emoji": "✨", "minDay": 31, "label": "成熟期"},
              {"key": "evolve", "emoji": "🌟", "minDay": 91, "label": "进化体"},
          ]
          PET_STATE_LABELS = {
              "normal": "精神饱满", "sleep": "打瞌睡", "sick": "有点蔫",
              "faded": "快消散了", "gone": "暂时离开了",
          }

          # 断签档位 → 花园枯萎比例（连续断签天数 → witherRatio）
          # ⚠️ 改动需同步 js/systems/punishment.js
          WITHER_TIERS = [(7, 1.0), (5, 0.9), (3, 0.6), (2, 0.3)]

          # 野餐篮发放规则：连续 N 天 → 券列表
          # （kind, amount 元, source, 中文名）
          MILESTONE_RULES = {
              7:   [("basic", 50, "streak7", "基础野餐篮")],
              14:  [("upgrade", 100, "streak14", "升级野餐篮"), ("basic", 50, "streak14", "基础野餐篮")],
              30:  [("luxury", 200, "streak30", "豪华野餐篮"), ("gift", 0, "streak30", "纪念花")],
              100: [("luxury", 200, "streak100", "百天纪念篮"), ("gift", 0, "streak100", "纪念花")],
          }
          # 需要发「里程碑特别庆祝文案」的连续天数
          CELEBRATE_STREAKS = (7, 14, 30, 100)

          # ---------------------------- 文案 ----------------------------
          # 每个槽 3~5 个变体，用 hash(dayKey + slotKey) % len 稳定选取，
          # 保证同一天同一槽刷新/重跑都抽到同一条（不会跳变）。
          # 语气严格按心理学设计：鼓励为主鞭策为辅，结尾永远留希望感，绝不打击自尊。
          # ⚠️ 改动需同步 js/systems/pet.js 的 speak()
          #
          # 可用占位符：{pet} {owner} {done} {total} {pending} {streak} {days}
          #             {day} {best} {petEmoji} {petState} {stageLabel} {basketLine}

          COPY = {
              "morning": [
                  ["🌤 {pet}揉了揉眼睛：早安呀～",
                   "今天的核心任务有 {total} 项，已完成 {done} 项。",
                   "我们已经一起走了 {streak} 天，再 {days} 天就能换一只新的野餐篮 🧺",
                   "先挑最不费力的那一项开始，晨光会替你加油。"],
                  ["☀️ 早安！{pet}已经在窗台上晒太阳了。",
                   "昨天是连续第 {streak} 天，我今天想续上第 {streakNext} 天。",
                   "今日 {total} 项核心，已完成 {done} 项，还差 {pending} 项。",
                   "不用一口气做完，做完第一项，今天就算赢了一半。"],
                  ["🌱 早，{pet}今天也在。",
                   "今天 {total} 项核心任务，完成 {done} 项 —— 剩下的我们慢慢啃。",
                   "距离下一只野餐篮还有 {days} 天，我想和你一起去野餐 🧺",
                   "喝口水，伸个懒腰，我们开始吧。"],
                  ["🐣 {pet}：早呀，昨晚我梦到你又完成了很棒的一天。",
                   "今日进度 {done}/{total}，连续 {streak} 天。",
                   "今天天气很好，适合把最难的那件先解决掉 ☀️",
                   "做不完也没关系，我会一直在这儿等你回来。"],
              ],
              "noon": [
                  ["🍚 午饭时间到，{pet}也想加餐了。",
                   "上午做了 {done}/{total} 项，剩下的先放一放。",
                   "吃完饭回来再补一项，中午那二十分钟意外地好用。",
                   "别急，饭要好好吃。"],
                  ["🥢 {pet}：先吃饭，任务不会跑掉的。",
                   "今天核心 {done}/{total}，还差 {pending} 项。",
                   "吃饱了脑子才转得快，下午我们一口气解决它。",
                   "记得喝汤 🍲"],
                  ["🍱 中午啦～今日进度 {done}/{total}。",
                   "没做完的先记在心里，它会自己惦记着你 😉",
                   "饭后散步十分钟，回来再收掉一项。",
                   "我们还有一整个下午呢。"],
                  ["🌤 {pet}趴在饭盒边：一起吃个午饭吧。",
