                   "下午挑 {pending} 项里最短的那个，五分钟就能划掉一个。",
                   "慢慢来，比较快。"],
              ],
              "dusk": [
                  ["🌇 傍晚了，{pet}在窗边等你。",
                   "今天核心 {done}/{total}，还差 {pending} 项。",
                   "连续 {streak} 天，别让它断在一半呀。",
                   "还剩几个小时，够用的。"],
                  ["🌆 {pet}：天要黑了，我们来收个尾。",
