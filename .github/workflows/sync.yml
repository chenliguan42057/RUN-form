name: 同步打卡数据

# 触发：仓库收到 repository_dispatch 事件（前端点击「同步到仓库」触发）
on:
  repository_dispatch:
    types: [sync-checkins]

# 赋予 GITHUB_TOKEN 写权限，用于提交 data/checkins.json
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 使用 GITHUB_TOKEN 提交，无需用户 secret
          persist-credentials: true

      - name: 合并并写入台账
        # client_payload.checkins 由前端通过 repository_dispatch 传入
        env:
          CHECKINS_JSON: ${{ toJson(github.event.client_payload.checkins) }}
        run: |
          python3 - <<'PY'
          import os, json

          # 解析传入的台账数组
          raw = os.environ.get("CHECKINS_JSON", "[]")
          try:
              incoming = json.loads(raw)
          except Exception:
              incoming = []
          if not isinstance(incoming, list):
              incoming = []

          # 确保 data/ 目录存在
          data_dir = "data"
          os.makedirs(data_dir, exist_ok=True)
          path = os.path.join(data_dir, "checkins.json")

          # 读取已有台账
          existing = []
          if os.path.exists(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      existing = json.load(f)
                  if not isinstance(existing, list):
                      existing = []
              except Exception:
                  existing = []

          # 按 id 去重合并（无 id 的旧记录退化为 ts），避免同 ts 静默丢记录
          def key_of(item):
              return item.get("id") or item.get("ts")

          seen = {key_of(item) for item in existing if isinstance(item, dict)}
          for item in incoming:
              if isinstance(item, dict) and key_of(item) not in seen:
                  existing.append(item)
                  seen.add(key_of(item))

          # 按时间升序保存（便于阅读；前端展示仍按倒序）
          existing.sort(key=lambda x: x.get("ts", 0))

          with open(path, "w", encoding="utf-8") as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)

          print(f"合并后共 {len(existing)} 条记录")
          PY

      - name: 提交并推送
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/checkins.json
          # 仅在有变更时提交，避免空提交
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 同步打卡台账 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
