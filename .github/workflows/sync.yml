name: 同步打卡数据

# 触发：仓库收到 repository_dispatch 事件
# （前端打卡 / 删除 / 清空后自动同步，或手动点击「同步到仓库」按钮）
on:
  repository_dispatch:
    types: [sync-checkins]

# 赋予 GITHUB_TOKEN 写权限，用于提交 data/checkins.json
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 使用 GITHUB_TOKEN 提交，无需用户 secret
          persist-credentials: true

      - name: 全量覆盖写入台账
        # client_payload.checkins 由前端通过 repository_dispatch 传入
        # 语义：浏览器端台账是唯一真源——前端推什么，远端就是什么。
        # 因此这里【整体覆盖】data/checkins.json，不再以远端已有内容为基准累加，
        # 否则前端的删除 / 清空永远同步不到仓库（append-only 只增不减）。
        env:
          CHECKINS_JSON: ${{ toJson(github.event.client_payload.checkins) }}
        run: |
          python3 - <<'PY'
          import os, json

          # 解析传入的台账数组；解析失败或类型不对时退化为空数组
          raw = os.environ.get("CHECKINS_JSON", "[]")
          try:
              incoming = json.loads(raw)
          except Exception:
              incoming = []
          if not isinstance(incoming, list):
              incoming = []

          # 只保留合法的对象记录，过滤掉脏数据
          records = [item for item in incoming if isinstance(item, dict)]

          # 按 id 去重（无 id 的旧记录退化为 ts），防止 payload 内部意外重复；
          # 保留首次出现的那条，保持前端顺序语义
          def key_of(item):
              return item.get("id") or item.get("ts")

          deduped = []
          seen = set()
          for item in records:
              k = key_of(item)
              if k in seen:
                  continue
              seen.add(k)
              deduped.append(item)

          # 按时间升序保存（便于阅读；前端展示仍按倒序）
          deduped.sort(key=lambda x: x.get("ts", 0))

          # 确保 data/ 目录存在
          data_dir = "data"
          os.makedirs(data_dir, exist_ok=True)
          path = os.path.join(data_dir, "checkins.json")

          # 整体覆盖写入：删除过的记录不会残留，清空则写入空数组
          with open(path, "w", encoding="utf-8") as f:
              json.dump(deduped, f, ensure_ascii=False, indent=2)

          dropped = len(records) - len(deduped)
          print(f"已全量覆盖写入 {len(deduped)} 条记录（去重丢弃 {dropped} 条）")
          PY

      - name: 提交并推送
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/checkins.json
          # 仅在有变更时提交，避免空提交
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 同步打卡台账 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
