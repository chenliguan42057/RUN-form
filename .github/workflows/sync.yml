name: 同步打卡数据

# 触发：仓库收到 repository_dispatch 事件
# （前端打卡 / 删除 / 清空 / 增删改计划后自动同步，或手动点击「同步到仓库」按钮）
#
# ⚠️ event_type 与 client_payload 的结构是 store.js dispatchSync() / dispatchMemos() 的输出契约，
#   两边必须同时改，否则同步会静默失效。
#   · sync-checkins：打卡数据（plans / checkins / tombstones）
#   · sync-memos：   备忘录（memos / tombstones.memos），v6.1 新增，独立走 data/memos.json
on:
  repository_dispatch:
    types: [sync-checkins, sync-memos]

# 赋予 GITHUB_TOKEN 写权限，用于提交 data/*.json
permissions:
  contents: write

# 前端连续操作会防抖成一次 dispatch，但用户在多个标签页 / 多台设备同时操作时
# 仍可能并发触发。排队执行避免两个 job 同时 push 造成的反复冲突。
concurrency:
  group: sync-checkins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 使用 GITHUB_TOKEN 提交，无需用户 secret
          persist-credentials: true
          # 取全量历史：推送冲突时要用 git pull --rebase 重试，浅克隆会 rebase 失败
          fetch-depth: 0

      - name: 合并写入计划与台账（墓碑剔除 + 跨设备删除累积）
        # ────────────────────────────────────────────────────────────────
        # v5 起改为【合并】，不再全量覆盖。原因见下：
        #
        # 旧版是「前端推什么、仓库就是什么」，这样删除才能同步到仓库。
        # 但副作用很致命：仓库被【最后一个同步的设备】单方面定义。
        #   手机攒了 200 条 → 同步 → 仓库 200 条
        #   换台新电脑打开网页（localStorage 空的）→ 随手一动触发同步
        #   → 仓库被覆盖成 0 条，200 条备份全没
        # 而前端从不回拉仓库数据，所以这是纯粹的备份损失，救不回来。
        #
        # 现在的做法：
        #   1) 读仓库现有内容，与前端推上来的按 id 合并（前端版本优先，因为它更新）
        #   2) 再按 client_payload.tombstones 里的 id 精确剔除 —— 删除依然生效
        #
        # v6.2 改进（跨设备一致性）：
        #   · 仓库维护 data/tombstones.json，累积所有设备的删除（key=id, value=删除时间戳）。
        #     任何设备删了某条，其 id 会永久留在仓库墓碑里（TTL 180 天，老格式 ts=0 永不过期），
        #     因此另一台设备之后同步、即便本地还留着这条，也会被墓碑剔除 → 删除真正跨设备生效。
        #   · 同 id 冲突时按 updatedAt 取较大者（最后写入胜出），而不是「谁后同步谁覆盖」。
        #   · 每次成功写入后额外产出 data/last-sync.json，供前端回读「最近同步时间」。
        #
        # 兼容性：payload 里 tombstones 是 map 形式（{plans:{id:ts},...}）；
        #   若检测到它是 id 列表（老前端），自动按列表处理，行为与 v6.1 一致。
        #   完全没有任何 tombstones 字段时（更老前端），退回全量覆盖。
        # ────────────────────────────────────────────────────────────────
        env:
          EVENT_TYPE: ${{ github.event.action }}
          PLANS_JSON: ${{ toJson(github.event.client_payload.plans) }}
          CHECKINS_JSON: ${{ toJson(github.event.client_payload.checkins) }}
          TOMBSTONES_JSON: ${{ toJson(github.event.client_payload.tombstones) }}
          MEMOS_JSON: ${{ toJson(github.event.client_payload.memos) }}
        run: |
          python3 - <<'PY'
          import os, json, time

          event_type = os.environ.get("EVENT_TYPE", "sync-checkins")
          now = int(time.time() * 1000)
          TTL_MS = 180 * 24 * 3600 * 1000

          def parse_list(env_name):
              """解析环境变量里的 JSON 数组；解析失败或类型不对时退化为空数组。"""
              raw = os.environ.get(env_name, "[]")
              try:
                  value = json.loads(raw)
              except Exception:
                  value = []
              if not isinstance(value, list):
                  value = []
              # 只保留合法的对象记录，过滤掉脏数据
              return [item for item in value if isinstance(item, dict)]

          def read_repo_list(path):
              """读仓库里已有的 JSON 数组；文件缺失 / 损坏一律当空数组。"""
              try:
                  with open(path, encoding="utf-8") as fp:
                      value = json.load(fp)
              except (OSError, ValueError):
                  return []
              if not isinstance(value, list):
                  return []
              return [item for item in value if isinstance(item, dict)]

          def key_of(item):
              """记录的唯一键：优先 id，老记录没有 id 就退化用 ts。"""
              return item.get("id") or item.get("ts")

          def merge(remote, incoming, dead):
              """
              远端 + 前端 按 id 合并，再剔除墓碑。
              冲突时（同 id 两边都有）保留 updatedAt 较大者（最后写入胜出）；
              缺 updatedAt 的老记录以 incoming 兜底，避免把新数据覆盖掉。
              """
              by_remote = {}
              order = []
              for it in remote:
                  k = key_of(it)
                  if k is None:
                      continue
                  if k not in by_remote:
                      order.append(k)
                  by_remote[k] = it
              result = dict(by_remote)
              for it in incoming:
                  k = key_of(it)
                  if k is None:
                      continue
                  if k not in result:
                      order.append(k)
                      result[k] = it
                  else:
                      r_ts = result[k].get("updatedAt") or 0
                      i_ts = it.get("updatedAt") or 0
                      if i_ts >= r_ts:
                          result[k] = it
              return [result[k] for k in order if str(k) not in dead]

          def parse_tomb(raw, kind):
              """把 payload 里的 tombstones 解析成 {id: ts}；兼容老前端的 id 列表形式。"""
              if not isinstance(raw, dict):
                  return {}
              val = raw.get(kind)
              if val is None:
                  return {}
              if isinstance(val, list):
                  return {str(x): 0 for x in val if x}
              if isinstance(val, dict):
                  return {str(k): (v or 0) for k, v in val.items()}
              return {}

          def read_repo_tomb(path):
              """读仓库累积墓碑；结构 {plans:{id:ts}, checkins:{id:ts}, memos:{id:ts}}。"""
              try:
                  with open(path, encoding="utf-8") as fp:
                      v = json.load(fp)
              except (OSError, ValueError):
                  v = {}
              if not isinstance(v, dict):
                  v = {}
              out = {}
              for kind in ("plans", "checkins", "memos"):
                  kv = v.get(kind)
                  out[kind] = kv if isinstance(kv, dict) else {}
              return out

          # ── 仓库累积墓碑（跨设备删除持久化）──
          repo_tomb_path = os.path.join("data", "tombstones.json")
          repo_tomb = read_repo_tomb(repo_tomb_path)
          synced_at = {}

          if event_type == "sync-memos":
              kind = "memos"
              incoming = parse_list("MEMOS_JSON")
              try:
                  raw_tomb = json.loads(os.environ.get("TOMBSTONES_JSON", "null"))
              except Exception:
                  raw_tomb = None
              inc_tomb = parse_tomb(raw_tomb, kind)
              acc = dict(repo_tomb.get(kind, {}))
              acc.update(inc_tomb)
              # TTL 裁剪：ts==0（老格式 / 永久生效）永不裁剪
              acc = {k: v for k, v in acc.items() if v == 0 or (now - int(v or 0)) <= TTL_MS}
              dead = set(str(k) for k in acc.keys())
              merged = merge(read_repo_list("data/memos.json"), incoming, dead)
              os.makedirs("data", exist_ok=True)
              with open(os.path.join("data", "memos.json"), "w", encoding="utf-8") as f:
                  json.dump(merged, f, ensure_ascii=False, indent=2)
              repo_tomb[kind] = acc
              synced_at[kind] = now
              print(f"sync-memos：合并写入 {len(merged)} 条备忘录（累积墓碑 {len(dead)} 条）")
          else:
              raw_tomb = os.environ.get("TOMBSTONES_JSON", "null")
              try:
                  tomb = json.loads(raw_tomb)
              except Exception:
                  tomb = None
              merge_mode = isinstance(tomb, dict)

              plans_in = parse_list("PLANS_JSON")
              checkins_in = parse_list("CHECKINS_JSON")

              if merge_mode:
                  merged = {}
                  for kind, incoming in (("plans", plans_in), ("checkins", checkins_in)):
                      inc_tomb = parse_tomb(tomb, kind)
                      acc = dict(repo_tomb.get(kind, {}))
                      acc.update(inc_tomb)
                      acc = {k: v for k, v in acc.items() if v == 0 or (now - int(v or 0)) <= TTL_MS}
                      dead = set(str(k) for k in acc.keys())
                      merged[kind] = merge(read_repo_list("data/%s.json" % kind), incoming, dead)
                      repo_tomb[kind] = acc
                      synced_at[kind] = now
                  plans = merged["plans"]
                  checkins = merged["checkins"]
                  mode_desc = (
                      f"合并模式（累积墓碑 {len(repo_tomb.get('plans', {}))} 计划 / "
                      f"{len(repo_tomb.get('checkins', {}))} 记录）"
                  )
              else:
                  # 老前端兼容路径：与改造前一字不差
                  def dedupe(records):
                      seen, result = set(), []
                      for item in records:
                          k = key_of(item)
                          if k in seen:
                              continue
                          seen.add(k)
                          result.append(item)
                      return result

                  plans = dedupe(plans_in)
                  checkins = dedupe(checkins_in)
                  mode_desc = "全量覆盖模式（payload 未带 tombstones，判定为老版本前端）"

              checkins.sort(key=lambda x: x.get("ts", 0))       # 台账按时间升序，便于阅读

              os.makedirs("data", exist_ok=True)

              with open(os.path.join("data", "plans.json"), "w", encoding="utf-8") as f:
                  json.dump(plans, f, ensure_ascii=False, indent=2)

              with open(os.path.join("data", "checkins.json"), "w", encoding="utf-8") as f:
                  json.dump(checkins, f, ensure_ascii=False, indent=2)

              print(f"{mode_desc}：写入 {len(plans)} 个计划、{len(checkins)} 条打卡记录")

          # ── 写回累积墓碑 ──
          with open(repo_tomb_path, "w", encoding="utf-8") as f:
              json.dump(repo_tomb, f, ensure_ascii=False, indent=2)

          # ── 写最近同步状态，供前端回读（消除「以为成功其实没同步」）──
          last_sync = {}
          try:
              with open(os.path.join("data", "last-sync.json"), encoding="utf-8") as fp:
                  last_sync = json.load(fp)
              if not isinstance(last_sync, dict):
                  last_sync = {}
          except (OSError, ValueError):
              last_sync = {}
          for k, v in synced_at.items():
              last_sync[k] = v
          last_sync["status"] = "ok"
          last_sync["updatedAt"] = now
          with open(os.path.join("data", "last-sync.json"), "w", encoding="utf-8") as f:
              json.dump(last_sync, f, ensure_ascii=False, indent=2)
          PY

      - name: 提交并推送
        env:
          EVENT_TYPE: ${{ github.event.action }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # ⚠️⚠️ 按事件类型只 add 对应业务文件，【绝对不要】写成 `git add data/`。
          #   data/reminder-state.json 由 dingtalk-reminder.yml 独占写入（提醒送达状态），
          #   前端只读、从不上传。一旦这里把它一起提交，就会用「检出时的旧快照」
          #   覆盖掉提醒工作流刚写进去的新记录，导致：
          #     1) 已推送过的计划被判定成「没推过」，同一天重复轰炸；
          #     2) 前端热力图上的青色（提醒送达）格子凭空消失。
          if [ "$EVENT_TYPE" = "sync-memos" ]; then
            git add data/memos.json
          else
            git add data/plans.json data/checkins.json
          fi

          # 累加墓碑 + 最近同步状态：这两个文件由本工作流独占，安全提交
          git add data/tombstones.json data/last-sync.json

          # 仅在有变更时提交，避免空提交
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 同步计划与打卡台账 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # dingtalk-reminder.yml 可能正好也在推 data/reminder-state.json，
            # 撞车了就 rebase 后重试；两个工作流改的是不同文件，rebase 不会冲突。
            git push || {
              echo "推送冲突，rebase 后重试"
              git pull --rebase --autostash
              git push
            }
          fi
