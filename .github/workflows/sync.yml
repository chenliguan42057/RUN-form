name: 同步打卡数据

# 触发：仓库收到 repository_dispatch 事件
# （前端打卡 / 删除 / 清空 / 增删改计划后自动同步，或手动点击「同步到仓库」按钮）
#
# ⚠️ event_type 与 client_payload 的结构是 store.js dispatchSync() 的输出契约，
#   两边必须同时改，否则同步会静默失效。
on:
  repository_dispatch:
    types: [sync-checkins]

# 赋予 GITHUB_TOKEN 写权限，用于提交 data/*.json
permissions:
  contents: write

# 前端连续操作会防抖成一次 dispatch，但用户在多个标签页 / 多台设备同时操作时
# 仍可能并发触发。排队执行避免两个 job 同时 push 造成的反复冲突。
concurrency:
  group: sync-checkins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 使用 GITHUB_TOKEN 提交，无需用户 secret
          persist-credentials: true
          # 取全量历史：推送冲突时要用 git pull --rebase 重试，浅克隆会 rebase 失败
          fetch-depth: 0

      - name: 全量覆盖写入计划与台账
        # client_payload.{plans,checkins} 由前端通过 repository_dispatch 传入
        # 语义：浏览器端是唯一真源——前端推什么，远端就是什么。
        # 因此这里【整体覆盖】data/plans.json 与 data/checkins.json，不以远端内容为基准累加，
        # 否则前端的删除 / 清空永远同步不到仓库（append-only 只增不减）。
        env:
          PLANS_JSON: ${{ toJson(github.event.client_payload.plans) }}
          CHECKINS_JSON: ${{ toJson(github.event.client_payload.checkins) }}
        run: |
          python3 - <<'PY'
          import os, json

          def parse_list(env_name):
              """解析环境变量里的 JSON 数组；解析失败或类型不对时退化为空数组。"""
              raw = os.environ.get(env_name, "[]")
              try:
                  value = json.loads(raw)
              except Exception:
                  value = []
              if not isinstance(value, list):
                  value = []
              # 只保留合法的对象记录，过滤掉脏数据
              return [item for item in value if isinstance(item, dict)]

          def dedupe(records):
              """按 id 去重（无 id 的旧记录退化为 ts），保留首次出现的那条。"""
              seen = set()
              result = []
              for item in records:
                  key = item.get("id") or item.get("ts")
                  if key in seen:
                      continue
                  seen.add(key)
                  result.append(item)
              return result

          plans = dedupe(parse_list("PLANS_JSON"))          # 计划保持前端顺序
          checkins = dedupe(parse_list("CHECKINS_JSON"))
          checkins.sort(key=lambda x: x.get("ts", 0))       # 台账按时间升序，便于阅读

          os.makedirs("data", exist_ok=True)

          with open(os.path.join("data", "plans.json"), "w", encoding="utf-8") as f:
              json.dump(plans, f, ensure_ascii=False, indent=2)

          with open(os.path.join("data", "checkins.json"), "w", encoding="utf-8") as f:
              json.dump(checkins, f, ensure_ascii=False, indent=2)

          print(f"已全量覆盖写入 {len(plans)} 个计划、{len(checkins)} 条打卡记录")
          PY

      - name: 提交并推送
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # ⚠️⚠️ 只 add 这两个文件，【绝对不要】写成 `git add data/` 或加上
          #   data/reminder-state.json。
          #   reminder-state.json 由 dingtalk-reminder.yml 独占写入（提醒送达状态），
          #   前端只读、从不上传。一旦这里把它一起提交，就会用「检出时的旧快照」
          #   覆盖掉提醒工作流刚写进去的新记录，导致：
          #     1) 已推送过的计划被判定成「没推过」，同一天重复轰炸；
          #     2) 前端热力图上的青色（提醒送达）格子凭空消失。
          git add data/plans.json data/checkins.json

          # 仅在有变更时提交，避免空提交
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 同步计划与打卡台账 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # dingtalk-reminder.yml 可能正好也在推 data/reminder-state.json，
            # 撞车了就 rebase 后重试；两个工作流改的是不同文件，rebase 不会冲突。
            git push || {
              echo "推送冲突，rebase 后重试"
              git pull --rebase --autostash
              git push
            }
          fi
