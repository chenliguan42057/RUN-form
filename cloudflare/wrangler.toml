name = "runform-sync"
main = "worker.js"
compatibility_date = "2024-09-23"

# 非机密变量（可提交）
[vars]
GH_OWNER = "chenliguan42057"
GH_REPO = "RUN-form"
# 设为 * 以支持「任何设备 / 任何软件」打开都能同步（本地 file://、微信内置浏览器等
# Origin 为 null 或各异的情况也能通过 CORS）。滥用防护由 APP_KEY 共享密钥承担。
ALLOWED_ORIGIN = "*"
ALLOWED_EVENTS = "sync-checkins,sync-memos,notify-new"

# ===== 部署前必须设置的【密钥】（不要写进本文件 / 仓库）=====
#   wrangler secret put GH_PAT      # 粘贴你的 GitHub PAT（repo 权限）
#   wrangler secret put APP_KEY      # 粘贴与前端 SYNC_APP_KEY 完全一致的值
#
# 前端 SYNC_APP_KEY 当前值见 store.js：runform-shared-9k2d
# 两者必须一致，否则 Worker 返回 403。
