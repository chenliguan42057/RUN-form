<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>不按惯例 · 个人打卡</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <!-- 顶部标题区 -->
    <header class="hero">
      <h1 class="hero-title">不按惯例</h1>
      <p class="hero-subtitle">今天，你按惯例了吗？</p>
    </header>

    <!-- 今日打卡卡片：选计划 → 一键打卡 → 看今日记录 -->
    <section class="card" id="today-card">
      <h2 class="card-title">今日打卡</h2>

      <form id="quick-checkin" class="checkin-form">
        <label for="plan-select" class="field-label">选择计划</label>
        <select id="plan-select" class="input">
          <option value="">— 请选择计划 —</option>
        </select>
        <button type="submit" class="btn btn-vg-gold" id="quick-checkin-btn">打卡</button>
      </form>

      <p class="empty-hint" id="plan-empty" hidden>
        还没有计划，去管理页添加吧 · <a href="manage.html">去添加计划</a>
      </p>

      <hr class="divider" />

      <h3 class="card-subtitle">今日记录</h3>
      <div id="today-list"><!-- 由 app.js 动态渲染 --></div>
      <p class="empty-hint" id="today-empty" hidden>今天还没有打卡记录。</p>
    </section>

    <footer class="footer">
      <a id="manage-btn" class="btn btn-vg-blue" href="manage.html">管理</a>
      <p>不按惯例 · RUN-form · 数据存于本地浏览器</p>
    </footer>
  </main>

  <!-- 全局 toast 提示容器 -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
