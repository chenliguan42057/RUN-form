<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 固定深色主题：告诉浏览器表单控件 / 滚动条也走深色 -->
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#060a16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="星河契约" />
  <title>天文台 · 星河契约</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <!-- v6 主题防闪：必须在 styles.css 之前落 data-theme，否则会先闪一帧默认色 -->
  <script>
    (function () {
      try {
        var mode = "auto";
        var value = "";
        var raw = localStorage.getItem("runform_theme");
        if (raw) {
          var o = JSON.parse(raw);
          if (o && typeof o === "object") {
            mode = o.mode === "manual" ? "manual" : "auto";
            value = typeof o.value === "string" ? o.value : "";
          }
        }
        var t = mode === "manual" && value ? value : "";
        if (!t) {
          var h = new Date().getHours();
          t = h < 5 ? "polar" : h < 8 ? "dawn" : h < 18 ? "origin" : "midnight";
        }
        if (t && t !== "origin") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        /* 读不到就用默认主题，绝不因此白屏 */
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container" id="app-root">
    <!-- 顶部胶囊导航：由 components.js 的 uiNav('home') 注入 -->
    <div id="nav-slot"></div>

    <!-- 页头：观星台身份 + 时段旁白 + 日期 -->
    <header class="hero">
      <h1 class="hero-title">天文台</h1>
      <p class="hero-subtitle" id="sky-poem">今夜也在这里，看着自己的星。</p>
      <p class="hero-meta">
        <span id="greeting">🌌 你好</span> · <span id="today-date">—</span>
      </p>
      <!-- v6 段位徽章：独立槽位，不碰 renderHeader() 里那两段逻辑 -->
      <p class="hero-meta" id="rank-slot"><!-- uiRankBadge 注入 --></p>
    </header>

    <!-- 提醒数据降级提示（读不到 data/reminder-state.json 时出现） -->
    <div class="chip-wrap" id="chip-wrap" hidden>
      <span class="offline-chip" id="offline-chip"></span>
    </div>

    <!-- 主卡：下一颗要点亮的星 + 今夜进度环 -->
    <section class="card next-card theme-gold" id="next-card">
      <div class="next-ring" id="next-ring"><!-- uiRing 注入 --></div>

      <div class="next-body" id="next-body">
        <p class="next-kicker">下一颗要点亮的星</p>
        <h2 class="next-name">
          <span class="next-icon" id="next-icon" aria-hidden="true">🌟</span>
          <span id="next-name">—</span>
        </h2>
        <p class="next-desc" id="next-desc" hidden></p>
        <p class="next-meta" id="next-meta">—</p>
        <span class="next-count" id="next-countdown">—</span>
        <div class="next-actions">
          <!-- 「点亮」保留为二级按钮，可在星图页的设置抽屉里关闭 -->
          <button type="button" class="btn btn-ghost btn-sm" id="manual-check-btn" hidden>
            点亮
          </button>
          <a class="btn btn-ghost btn-sm" href="manage.html">去星图</a>
        </div>
      </div>

      <p class="empty-hint" id="next-empty" hidden>
        <span class="empty-icon" aria-hidden="true">🌑</span>
        你的星空还是一片暗区，去 <a href="manage.html">星图</a> 缔结第一颗星吧。
      </p>
    </section>

    <!-- v6 · 此刻的颜色：只在刚点亮一颗星之后出现，随手一点，不点也行 -->
    <section class="card" id="mood-card" hidden>
      <div class="card-head">
        <h2 class="card-title">🎨 刚才那一下</h2>
        <button type="button" class="mini-btn" id="mood-skip">不记了</button>
      </div>
      <div id="mood-slot"><!-- uiMoodPicker 注入 --></div>
    </section>

    <!-- v6 · 静坐一程（专注计时）：focus.js 按需注入后才渲染 -->
    <section class="card" id="focus-card" hidden>
      <div class="card-head">
        <h2 class="card-title">🕯 静坐一程</h2>
        <button type="button" class="mini-btn" id="focus-log-btn">看记录</button>
      </div>
      <div id="focus-slot"><!-- uiFocusDial 注入 --></div>
      <div id="focus-log" hidden><!-- 近期专注记录 --></div>
    </section>

    <!-- 天象概览：四个天文指标 -->
    <section class="card">
      <div class="card-head">
        <h2 class="card-title">🌌 今夜天象</h2>
        <a class="mini-btn" href="stats.html">看星历</a>
      </div>

      <div class="stat-grid stat-grid--astro">
        <div class="stat-tile theme-blue">
          <span class="stat-glyph" aria-hidden="true">✦</span>
          <div class="stat-astro-text">
            <span class="stat-value" id="stat-active">0</span>
            <span class="stat-label">已缔结星数</span>
          </div>
        </div>

        <div class="stat-tile theme-teal" id="tile-today">
          <span class="stat-glyph" aria-hidden="true">🌙</span>
          <div class="stat-astro-text">
            <span class="stat-value" id="stat-today">0</span>
            <span class="stat-label">今夜待点亮</span>
          </div>
        </div>

        <div class="stat-tile theme-gold stat-tile--comet">
          <div class="stat-comet" id="comet-slot"><!-- uiComet 注入 --></div>
          <div class="stat-astro-text">
            <span class="stat-value" id="stat-streak">0</span>
            <span class="stat-label">连续天数 · 彗尾</span>
          </div>
        </div>

        <div class="stat-tile theme-violet stat-tile--moon">
          <div class="stat-moon" id="moon-slot"><!-- uiMoonPhase 注入 --></div>
          <div class="stat-astro-text">
            <span class="stat-value" id="stat-rate">0%</span>
            <span class="stat-label" id="moon-name">近 30 天盈亏</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 今晚的星轨 -->
    <section class="card">
      <h2 class="card-title">🛰 今晚的星轨</h2>
      <ul class="rail" id="timeline"><!-- uiTimelineStar 注入 --></ul>
      <div id="timeline-empty" hidden><!-- uiEmpty 注入 --></div>
    </section>

    <!-- 近 12 周星点图 -->
    <section class="card">
      <div class="card-head">
        <h2 class="card-title">✨ 近 12 周星点</h2>
        <a class="mini-btn" href="stats.html">查看全年</a>
      </div>
      <div id="mini-heatmap"><!-- uiStarHeatmap 注入 --></div>
    </section>

    <!-- 星语 -->
    <section class="card quote-card">
      <div id="daily-quote"><!-- uiSkyQuote 注入 --></div>
    </section>

    <footer class="footer">
      <p>星河契约 · RUN-form · 数据存于本地浏览器</p>
    </footer>
  </main>

  <!-- v6 星屑画布（z-index 60，永不吃点击） -->
  <canvas id="fx-layer" aria-hidden="true"></canvas>
  <!-- v6 浮层挂载点（z-index 80，toast 仍在其上） -->
  <div id="overlay-root"></div>

  <!-- 全局 toast 提示容器 -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- PWA：注册 Service Worker（异步，不阻塞页面） -->
  <script src="register-sw.js"></script>
  <!-- 背景图 blur-up：高清图加载完后淡出低清占位 -->
  <script>
    (function () {
      const img = new Image();
      img.src = "assets/bg-vangogh-ocean.webp";
      if (img.complete) {
        document.body.classList.add("bg-ready");
      } else {
        img.addEventListener("load", function () {
          document.body.classList.add("bg-ready");
        });
      }
    })();
  </script>
  <!-- ⚠️ 加载顺序固定：store.js → v6 核心模块 → components.js → app.js
       首页只同步加载核心 5 个（约 43KB，卡在 45KB 预算内）；
       onboarding / focus / whitenoise / shortcuts / ambient / screensaver
       由 app.js 的 loadModule() 按需注入，老用户永远不下载引导脚本。 -->
  <script src="store.js"></script>
  <script src="sensory.js"></script>
  <script src="theme.js"></script>
  <script src="rank.js"></script>
  <script src="mood.js"></script>
  <script src="celebrate.js"></script>
  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
