<!DOCTYPE html>
<html lang="zh-CN" data-period="morning">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0e23" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="星夜花园" />
  <title>星夜花园 · 在静谧里慢慢开花</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />

  <!-- 防闪白：CSS 加载前先按当前时段把天空色写到 :root，避免先白一帧（§6.3 第 5 条） -->
  <script>
    (function () {
      try {
        var h = new Date().getHours();
        var p = h < 6 ? "night" : h < 9 ? "sunrise" : h < 12 ? "morning"
              : h < 14 ? "noon" : h < 18 ? "golden" : h < 20 ? "dusk" : "night";
        var SKY = {
          sunrise: ["#141833", "#241d4a"], morning: ["#0d1b32", "#143049"],
          noon: ["#0b1d3a", "#103950"], golden: ["#151a39", "#2a2348"],
          dusk: ["#141539", "#311f44"], night: ["#070b1c", "#121a3a"]
        };
        var s = SKY[p], r = document.documentElement;
        r.setAttribute("data-period", p);
        r.style.setProperty("--g-sky-from", s[0]);
        r.style.setProperty("--g-sky-to", s[1]);
      } catch (e) { /* 读不到就交给 tokens.css 的默认值 */ }
    })();
  </script>

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/scene.css" />
  <link rel="stylesheet" href="styles/pet.css" />
  <link rel="stylesheet" href="styles/garden.css" />
  <link rel="stylesheet" href="styles/ui.css" />
  <link rel="stylesheet" href="styles/shop.css" />
</head>
<body>
  <!-- 场景层：天空 / 云 / 彩虹 / 山丘 / 草地，动态元素由 js/ui/scene.js 注入 -->
  <div class="g-scene" id="scene-root" aria-hidden="true">
    <div class="g-scene__sky"></div>
    <div class="g-scene__clouds" id="cloud-layer"></div>
    <div class="g-scene__rainbow"></div>
    <div class="g-scene__sun"></div>
    <div class="g-scene__hills"></div>
    <div class="g-scene__grass"></div>
    <div class="g-scene__decor" id="decor-layer"></div>
    <div class="g-scene__particles" id="particle-layer"></div>
    <div class="g-scene__weather" id="weather-layer"></div>
  </div>

  <nav class="g-nav" id="g-nav" aria-label="主导航">
    <a class="g-nav__link g-nav__link--active" href="index.html">🏡 花园</a>
    <a class="g-nav__link" href="manage.html">📝 管理</a>
    <a class="g-nav__link" href="shop.html">🧺 市集</a>
    <a class="g-nav__link" href="stats.html">📖 档案</a>
  </nav>

  <main class="g-main" id="app-root">
    <header class="g-hero">
      <h1 class="g-hero__title">星夜花园</h1>
      <p class="g-hero__sub" id="greeting">夜色温柔，也照常开花</p>
      <p class="g-hero__meta">
        <span id="today-date">—</span> · <span id="period-note">—</span>
      </p>
    </header>

    <!-- 精灵 + 四项状态条 -->
    <section class="g-card g-card--pet" id="pet-card">
      <div class="g-pet" id="pet-slot"><!-- systems/pet.js render() 注入 --></div>
      <div class="g-pet__stats" id="pet-stats"><!-- 饱食 / 心情 / 能量 / 亲密 --></div>
    </section>

    <!-- 今日倒计时 + 里程碑 -->
    <section class="g-card" id="countdown-card">
      <h2 class="g-card__title">⏳ 今天还剩</h2>
      <p class="g-countdown u-num" id="countdown-slot">--:--:--</p>
      <p class="u-hint" id="countdown-milestone"></p>
    </section>

    <!-- 今日任务（N 朵花对应 N 个每日任务） -->
    <section class="g-card" id="tasks-card">
      <div class="g-card__head u-row u-row--between">
        <h2 class="g-card__title">🌷 今日任务</h2>
        <a class="u-btn u-btn--ghost u-btn--sm" href="manage.html">＋ 新增</a>
      </div>
      <ul class="g-task-list" id="task-list"></ul>
      <p class="u-hint" id="task-empty" hidden>还没有任务，去「管理」种下第一颗种子吧。</p>
    </section>

    <!-- 花园 -->
    <section class="g-card" id="garden-card">
      <div class="g-card__head u-row u-row--between">
        <h2 class="g-card__title">🌻 我的花园</h2>
        <span class="u-badge" id="bloom-badge">0 / 0</span>
      </div>
      <div class="g-garden" id="garden-slot"></div>
    </section>

    <!-- 连续全勤 + 野餐篮进度 -->
    <section class="g-card" id="streak-card">
      <h2 class="g-card__title">🔥 连续全勤</h2>
      <p class="g-streak u-num">
        <span id="streak-current">0</span> 天 · 最佳 <span id="streak-best">0</span> 天
      </p>
      <p class="u-hint" id="coupon-hint">再坚持几天，就能拿到野餐篮美食券啦。</p>
    </section>

    <footer class="g-footer">
      星夜花园 v2 · 数据存于本地浏览器 · 同步到仓库的数据是公开的，别写隐私
    </footer>
  </main>

  <div id="overlay-root"></div>
  <div id="toast" class="g-toast" role="status" aria-live="polite" hidden></div>

  <script src="js/core/boot.js"></script>
</body>
</html>
