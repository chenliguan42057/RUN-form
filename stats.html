<!DOCTYPE html>
<html lang="zh-CN" data-period="morning">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#87CEEB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="阳光花园" />
  <title>花园档案 · 阳光花园</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />

  <script>
    (function () {
      try {
        var h = new Date().getHours();
        var p = h < 6 ? "night" : h < 9 ? "sunrise" : h < 12 ? "morning"
              : h < 14 ? "noon" : h < 18 ? "golden" : h < 20 ? "dusk" : "night";
        var SKY = {
          sunrise: ["#FFD1B3", "#FFB6C1"], morning: ["#87CEEB", "#BFEFFF"],
          noon: ["#FFE66D", "#FFF3B0"], golden: ["#FFE9A8", "#98FB98"],
          dusk: ["#FFA07A", "#E6E6FA"], night: ["#1B2A5B", "#3D5A98"]
        };
        var s = SKY[p], r = document.documentElement;
        r.setAttribute("data-period", p);
        r.style.setProperty("--g-sky-from", s[0]);
        r.style.setProperty("--g-sky-to", s[1]);
      } catch (e) { /* 交给 tokens.css 默认值 */ }
    })();
  </script>

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/scene.css" />
  <link rel="stylesheet" href="styles/pet.css" />
  <link rel="stylesheet" href="styles/garden.css" />
  <link rel="stylesheet" href="styles/ui.css" />
  <link rel="stylesheet" href="styles/shop.css" />
</head>
<body>
  <div class="g-scene" id="scene-root" aria-hidden="true">
    <div class="g-scene__sky"></div>
    <div class="g-scene__hills"></div>
    <div class="g-scene__grass"></div>
  </div>

  <nav class="g-nav" id="g-nav" aria-label="主导航">
    <a class="g-nav__link" href="index.html">🏡 花园</a>
    <a class="g-nav__link" href="manage.html">📝 管理</a>
    <a class="g-nav__link" href="shop.html">🧺 市集</a>
    <a class="g-nav__link g-nav__link--active" href="stats.html">📖 档案</a>
  </nav>

  <main class="g-main" id="app-root">
    <header class="g-hero">
      <h1 class="g-hero__title">花园档案</h1>
      <p class="g-hero__sub">你走过的每一步，花园都记得</p>
      <p class="g-hero__meta">
        和 <span id="pet-name-label">小光</span> 一起
        <span class="u-num" id="days-together">0</span> 天
      </p>
    </header>

    <!-- 今日完成度环形进度 -->
    <section class="g-card" id="ring-card">
      <h2 class="g-card__title">🌞 今日完成度</h2>
      <div class="g-ring" id="ring-slot"><!-- 由 stats.js 注入 SVG 环形进度 --></div>
      <p class="u-hint u-center" id="ring-note">今天还没有开花</p>
    </section>

    <!-- 连续天数 -->
    <section class="g-card" id="streak-card">
      <h2 class="g-card__title">🔥 连续全勤</h2>
      <div class="u-row u-row--wrap" id="streak-slot">
        <div class="g-stat">
          <span class="g-stat__value u-num" id="streak-current">0</span>
          <span class="g-stat__label">当前（天）</span>
        </div>
        <div class="g-stat">
          <span class="g-stat__value u-num" id="streak-best">0</span>
          <span class="g-stat__label">最佳（天）</span>
        </div>
        <div class="g-stat">
          <span class="g-stat__value u-num" id="total-checkins">0</span>
          <span class="g-stat__label">累计打卡</span>
        </div>
        <div class="g-stat">
          <span class="g-stat__value u-num" id="total-points">0</span>
          <span class="g-stat__label">累计积分</span>
        </div>
      </div>
    </section>

    <!-- 近 12 周热力图 -->
    <section class="g-card" id="heatmap-card">
      <h2 class="g-card__title">🗓 近 12 周花开花落</h2>
      <div class="g-heatmap" id="heatmap-slot"></div>
      <p class="u-hint">颜色越深，那天开的花越多。</p>
    </section>

    <!-- 段位 -->
    <section class="g-card" id="rank-card">
      <h2 class="g-card__title">🏅 园丁段位</h2>
      <div class="g-rank" id="rank-slot"></div>
    </section>

    <!-- 成就墙 -->
    <section class="g-card" id="achievement-card">
      <h2 class="g-card__title">🎖 成就墙</h2>
      <div class="g-achievements" id="achievement-wall"></div>
    </section>

    <!-- 周报海报（纯前端 canvas 手绘，禁止第三方库） -->
    <section class="g-card" id="weekly-card">
      <div class="g-card__head u-row u-row--between">
        <h2 class="g-card__title">🖼 本周周报</h2>
        <button type="button" class="u-btn u-btn--ghost u-btn--sm" id="poster-btn">生成海报</button>
      </div>
      <canvas id="weekly-canvas" width="640" height="900" aria-label="本周花园周报"></canvas>
      <p class="u-hint" id="poster-hint">生成后可长按保存图片。</p>
    </section>

    <footer class="g-footer">
      阳光花园 v2 · 数据存于本地浏览器 · 同步到仓库的数据是公开的，别写隐私
    </footer>
  </main>

  <div id="overlay-root"></div>
  <div id="toast" class="g-toast" role="status" aria-live="polite" hidden></div>

  <script src="js/core/boot.js"></script>
</body>
</html>
