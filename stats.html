<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>星历 · 星河契约</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container" id="app-root">
    <!-- 顶部胶囊导航：由 components.js 的 uiNav('stats') 注入 -->
    <div id="nav-slot"></div>

    <header class="hero hero-small">
      <h1 class="hero-title">星历</h1>
      <p class="hero-subtitle">我的星途 · 一路点亮过的日子</p>
    </header>

    <div class="chip-wrap" id="chip-wrap" hidden>
      <span class="offline-chip" id="offline-chip"></span>
    </div>

    <!-- 里程碑祝贺 -->
    <div id="cheer-slot"><!-- uiCheer 注入 --></div>

    <!-- 总览四宫格 -->
    <section class="card">
      <h2 class="card-title">🌌 星途总览</h2>
      <div class="stat-grid">
        <div class="stat-tile theme-gold">
          <span class="stat-value" id="stat-streak">0</span>
          <span class="stat-label">当前连续</span>
        </div>
        <div class="stat-tile theme-amber">
          <span class="stat-value" id="stat-best">0</span>
          <span class="stat-label">最佳连续</span>
        </div>
        <div class="stat-tile theme-teal">
          <span class="stat-value" id="stat-days">0</span>
          <span class="stat-label">亮着的日子</span>
        </div>
        <div class="stat-tile theme-violet">
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-label">累计触达</span>
        </div>
      </div>
    </section>

    <!-- 星轨攀升：每个计划一条竖轨，连续越久升得越高 -->
    <section class="card">
      <h2 class="card-title">🚀 星轨攀升</h2>
      <div id="track-slot"><!-- uiStarTrack 注入 --></div>
    </section>

    <!-- 月度星历 -->
    <section class="card">
      <div class="card-head">
        <h2 class="card-title">🗓 月度星历</h2>
        <div class="month-nav">
          <button type="button" class="mini-btn" id="month-prev" aria-label="上一月">‹</button>
          <button type="button" class="mini-btn" id="month-today">回到本月</button>
          <button type="button" class="mini-btn" id="month-next" aria-label="下一月">›</button>
        </div>
      </div>
      <div id="month-slot"><!-- uiMonthGrid 注入 --></div>
    </section>

    <!-- 全年星点图 -->
    <section class="card">
      <div class="card-head">
        <h2 class="card-title">✨ 全年星点</h2>
        <select id="hm-source" class="input input-inline" aria-label="星点图数据来源">
          <option value="all">全部来源</option>
          <option value="auto">仅提醒送达</option>
          <option value="manual">仅手动点亮</option>
        </select>
      </div>
      <div id="heatmap-year"><!-- uiStarHeatmap 注入 --></div>
      <p class="setting-note" id="heatmap-summary">—</p>
    </section>

    <!-- 活跃趋势 -->
    <section class="card">
      <div class="card-head">
        <h2 class="card-title">📈 星光起伏</h2>
        <select id="trend-range" class="input input-inline" aria-label="趋势时间范围">
          <option value="30">近 30 天</option>
          <option value="90">近 90 天</option>
          <option value="180">近 180 天</option>
        </select>
      </div>
      <div id="trend-chart"><!-- uiSparkline 注入 --></div>
    </section>

    <!-- 星座亮度条（各计划近 30 天完成率） -->
    <section class="card">
      <h2 class="card-title">🎯 星座亮度（近 30 天）</h2>
      <div class="rate-list" id="rate-list"><!-- uiBrightBars 注入 --></div>
      <div id="rate-empty" hidden><!-- uiEmpty 注入 --></div>
    </section>

    <!-- 里程碑徽章 -->
    <section class="card">
      <h2 class="card-title">🏅 里程碑</h2>
      <div id="badge-grid"><!-- uiBadgeGrid 注入 --></div>
    </section>

    <!-- 频率分布 -->
    <section class="card">
      <h2 class="card-title">🧭 周期分布</h2>
      <div id="freq-dist"><!-- app3.js 渲染 --></div>
      <div class="freq-legend" id="freq-legend"></div>
    </section>

    <footer class="footer">
      <p>星河契约 · RUN-form · 青 = 提醒送达，金 = 手动点亮</p>
    </footer>
  </main>

  <!-- 全局 toast 提示容器 -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- ⚠️ 加载顺序固定：store.js → components.js → app3.js -->
  <script src="store.js"></script>
  <script src="components.js"></script>
  <script src="app3.js"></script>
</body>
</html>
